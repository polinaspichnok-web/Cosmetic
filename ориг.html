    // ТАЙМЕР — сохраняет состояние при перезагрузке
    let timerInterval;

    function startTimer() {
        if (!endTime) {
            let end = new Date();
            end.setHours(end.getHours() + 24);
            endTime = end.getTime();
            localStorage.setItem('saleEndTime', endTime);
        }
        function update() {
            let now = new Date().getTime();
            let diff = endTime - now;
            if (diff <= 0) {
                if (document.getElementById('timerDisc')) document.getElementById('timerDisc').innerHTML = "АКЦИЯ ЗАВЕРШЕНА";
                clearInterval(timerInterval);
                localStorage.removeItem('saleEndTime');
                return;
            }
            let h = Math.floor(diff / 3600000);
            let m = Math.floor((diff % 3600000) / 60000);
            let s = Math.floor((diff % 60000) / 1000);
            if (document.getElementById('timerDisc')) document.getElementById('timerDisc').innerHTML = `До окончания скидок: ${h}ч ${m}м ${s}с`;
        }
        if (timerInterval) clearInterval(timerInterval);
        update();
        timerInterval = setInterval(update, 1000);
    }

    function repeatOrder(order) {

            let product = products.find(p => p.name === itemName);
            if(product) {
                let existing = cart.find(x => x.id === product.id);
                if (existing) existing.qty += 1;
                else cart.push({ id: product.id, name: product.name, price: product.price, qty: 1, image: product.image });
            }
        });
        saveCart();
        showToast('Товары добавлены в корзину');

window.showTab = function(tab) {
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginBtn = document.getElementById('tabLoginBtn');
    const registerBtn = document.getElementById('tabRegisterBtn');
    
    if (tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        loginBtn.style.color = '#FF69B4';
        loginBtn.style.borderBottom = '2px solid #FF69B4';
        registerBtn.style.color = '#1a1a1a';
        registerBtn.style.borderBottom = '2px solid transparent';
    } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        loginBtn.style.color = '#1a1a1a';
        loginBtn.style.borderBottom = '2px solid transparent';
        registerBtn.style.color = '#FF69B4';
        registerBtn.style.borderBottom = '2px solid #FF69B4';
    }
};
    
window.doLogin = () => {
    let user = document.getElementById('loginUser')?.value;
    let pass = document.getElementById('loginPass')?.value;
    
    if (!user || !pass) {
        showToast('Введите логин и пароль');
        return;
    }
    
    currentUser = { 
        fullName: user, 
        username: user, 
        email: `${user}@temp.com`, 
        phone: '+375 00 000-00-00', 
        password: pass, 
        orders: [] 
    };
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    
    let users = JSON.parse(localStorage.getItem('users') || '{}');
    users[user] = currentUser;
    localStorage.setItem('users', JSON.stringify(users));
    
    showToast(`Добро пожаловать, ${user}!`);
    renderProfile();
};

window.doRegister = () => {
    let full = document.getElementById('regFull')?.value;
    let user = document.getElementById('regUser')?.value;
    let email = document.getElementById('regEmail')?.value;
    let phone = document.getElementById('regPhone')?.value;
    let pass = document.getElementById('regPass')?.value;
    
    if (!full || !user || !pass) {
        showToast('Заполните ФИО, логин и пароль');
        return;
    }
    
    let newUser = { 
        fullName: full, 
        username: user, 
        email: email || `${user}@temp.com`, 
        phone: phone || '+375 00 000-00-00', 
        password: pass, 
        orders: [] 
    };
    
    let users = JSON.parse(localStorage.getItem('users') || '{}');
    users[user] = newUser;
    localStorage.setItem('users', JSON.stringify(users));
    
    currentUser = newUser;
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    
    showToast('Регистрация успешна!');
    renderProfile();
};
